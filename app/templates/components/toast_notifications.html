<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 9999; margin-top: 1rem;"></div>

<script>
(function() {
    var messages = {{ get_flashed_messages(with_categories=true) | tojson | safe }};
    if (!messages.length) return;

    var container = document.querySelector('.toast-container');
    var icons = { success: 'ti-circle-check', danger: 'ti-alert-circle', warning: 'ti-alert-triangle', info: 'ti-info-circle' };

    window.showToast = function(message, type, delay) {
        type = type || 'info';
        delay = delay || 8000;
        var icon = icons[type] || 'ti-info-circle';
        var el = document.createElement('div');
        el.className = 'toast align-items-center text-white bg-' + type + ' border-0 shadow';
        el.setAttribute('role', 'alert');
        el.innerHTML = '<div class="d-flex align-items-center p-1"><div class="toast-body d-flex align-items-center gap-2 fw-medium"><i class="ti ' + icon + ' fs-5"></i>' + message + '</div><button type="button" class="btn-close btn-close-white me-2 ms-auto" data-bs-dismiss="toast"></button></div>';
        container.appendChild(el);
        var t = new bootstrap.Toast(el, { delay: delay });
        t.show();
        el.addEventListener('hidden.bs.toast', function() { el.remove(); });
    };

    messages.forEach(function(pair) {
        var type = pair[0] === 'error' ? 'danger' : (pair[0] || 'info');
        showToast(pair[1], type);
    });
})();
</script>
